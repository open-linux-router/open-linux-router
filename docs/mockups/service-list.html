<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Device services · layout study</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
    :root { font-family: 'DM Sans', sans-serif; color: #202124; background: #f7f8fa; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button { font: inherit; cursor: pointer; }
    .study { max-width: 1460px; margin: 0 auto; padding: 30px 36px 26px; }
    .eyebrow { color: #62819a; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 7px 0 5px; font-size: 26px; letter-spacing: -.045em; }
    .intro { margin: 0; color: #6c737b; font-size: 13px; line-height: 1.5; }
    .choices { display: flex; gap: 8px; margin: 23px 0 10px; flex-wrap: wrap; }
    .choice { border: 1px solid #dce2e7; background: #fff; padding: 9px 14px; border-radius: 9px; color: #53616b; font-size: 12px; font-weight: 600; }
    .choice[aria-selected="true"] { border-color: #298bb9; color: #096c9e; background: #e9f6fb; box-shadow: inset 0 0 0 1px #298bb9; }
    .explain { min-height: 36px; margin: 0 0 14px; font-size: 12px; color: #697681; line-height: 1.5; }
    .explain strong { color: #27343d; }
    .frame { overflow: hidden; border: 1px solid #dfe4e8; border-radius: 16px; background: #fff; box-shadow: 0 18px 55px #1f405012, 0 2px 7px #1f40500a; }
    .topbar { height: 65px; border-bottom: 1px solid #e9ecef; display: flex; align-items: center; gap: 36px; padding: 0 28px; white-space: nowrap; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; letter-spacing: -.03em; }
    .brand-mark { width: 17px; height: 17px; border-radius: 50%; background: conic-gradient(#f4606b 0 49%, #24b2df 50% 100%); position: relative; }
    .brand-mark::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: white; }
    nav { display: flex; align-self: stretch; align-items: center; gap: 28px; color: #737980; font-size: 13px; }
    nav span { display: flex; align-items: center; height: 100%; }
    nav .active { color: #202124; border-bottom: 2px solid #343b40; font-weight: 600; }
    .sun { margin-left: auto; font-size: 19px; color: #353b42; }
    .canvas { padding: 28px 27px 42px; min-height: 720px; background: radial-gradient(ellipse at 48% -15%, #f3f8fa 0, transparent 43%), #fff; }
    .map { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
    .group-title { font-size: 14px; font-weight: 700; letter-spacing: -.025em; margin: 0 0 10px 7px; }
    .list { border: 1px solid #e4e6e8; border-radius: 17px; overflow: hidden; background: #fff; }
    .other .list { border-style: dashed; }
    .device { min-height: 48px; padding: 0 12px 0 13px; display: flex; align-items: center; gap: 10px; position: relative; }
    .device + .device::before { content: ''; position: absolute; top: 0; left: 52px; right: 0; height: 1px; background: #eceeef; }
    .device-img { width: 30px; height: 32px; flex: none; object-fit: contain; filter: drop-shadow(0 2px 2px #0002); }
    .unknown { width: 26px; height: 26px; margin: 0 2px; border-radius: 5px; background: linear-gradient(140deg, #f1f2f3, #d3d7da); border: 1px solid #d4d7d9; box-shadow: 0 2px 4px #0002; flex: none; }
    .identity { min-width: 0; flex: 1; display: flex; align-items: center; gap: 6px; }
    .mode-a .identity .name { min-width: 0; flex: 1; }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; font-weight: 600; }
    .metric { flex: none; font-size: 11px; color: #80868b; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .svc { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 22px; height: 22px; border-radius: 6px; font-size: 10px; font-weight: 800; letter-spacing: -.06em; color: var(--ink, #fff); background: var(--tile, #278ad5); text-decoration: none; }
    .svc:not(.plain) { box-shadow: inset 0 0 0 1px #0000000a; }
    .svc.plain { background: #f2f4f5; color: #53616b; }
    .services { display: flex; align-items: center; gap: 3px; flex: none; }
    .inline-services { margin-left: 2px; padding-left: 7px; border-left: 1px solid #e3e7e9; }
    .mode-a .device { height: 49px; }
    .mode-b .device:has(.services) { min-height: 65px; align-items: flex-start; padding-top: 8px; }
    .mode-b .device:has(.services) .device-img { margin-top: 3px; }
    .mode-b .device:has(.services) .identity { display: block; }
    .mode-b .device:has(.services) .services { margin-top: 4px; }
    .mode-b .device:has(.services) .metric { margin-top: 5px; }
    .mode-c .device { height: 49px; }
    .service-index { display: none; padding: 10px 13px 11px; border-bottom: 1px solid #e9edef; background: #f8fafb; }
    .mode-c .service-index { display: block; }
    .index-label { font-size: 10px; color: #89949a; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; margin-bottom: 7px; }
    .index-item { display: inline-flex; align-items: center; gap: 4px; margin: 0 9px 5px 0; font-size: 10px; color: #58656b; }
    .index-item .svc { width: 19px; height: 19px; font-size: 9px; border-radius: 5px; }
    .note { margin: 15px 0 0; color: #9aa3a8; font-size: 11px; text-align: right; }
    @media (max-width: 1050px) { .map { grid-template-columns: repeat(2, minmax(0, 1fr)); } .canvas { min-height: 0; } }
    @media (max-width: 620px) { .study { padding: 20px 12px; } h1 { font-size: 23px; } .topbar { height: 54px; padding: 0 17px; } nav { gap: 16px; overflow: hidden; } nav span:not(.active) { display: none; } .brand { font-size: 12px; } .canvas { padding: 23px 13px; } .map { grid-template-columns: 1fr; gap: 22px; } .name { font-size: 13px; } .choice { flex: 1; padding: 9px 7px; } }
  </style>
</head>
<body>
  <main class="study">
    <div class="eyebrow">Overview / layout study</div>
    <h1>Devices with services</h1>
    <p class="intro">Same mock devices and groups, three ways to keep service access without breaking the list rhythm.</p>
    <div class="choices" role="tablist" aria-label="Layout variants">
      <button class="choice" role="tab" aria-selected="true" data-mode="a">A · Inline icons</button>
      <button class="choice" role="tab" aria-selected="false" data-mode="b">B · Compact second line</button>
      <button class="choice" role="tab" aria-selected="false" data-mode="c">C · Group service index</button>
    </div>
    <p class="explain" id="explain"></p>
    <section class="frame" aria-label="Overview mockup">
      <div class="topbar"><div class="brand"><i class="brand-mark"></i>Open Linux Router</div><nav><span class="active">Overview</span><span>Networks</span><span>Gateway</span><span>DHCP</span><span>DNS</span><span>Advanced</span></nav><div class="sun">☼</div></div>
      <div class="canvas"><div class="map" id="map"></div><div class="note">Illustrative data · no live router connection</div></div>
    </section>
  </main>
  <script>
    const asset = '../../web/src/assets/device-icons/'
    const services = {
      'DS1522plus': [['D', '#319cfa', 'Drive'], ['DSM', '#087fe3', 'DSM'], ['qb', '#d4ebff', 'qBittorrent', '#3984d5']],
      infra: [['◈', '#2468dc', 'Vault'], ['☘', '#70a647', 'Green service']],
      'Li-NUC-Windows': [['△', '#e7e1fc', 'Media', '#8c5bca']],
      'Mercury Switch 2.5G': [['M', '#ed3036', 'Mercury']],
      'network-routing': [['◈', '#222831', 'Routing']],
      Proxmox: [['X', '#f08b1f', 'Proxmox']],
      'TP-Link AP': [['TP', '#2999f0', 'TP-Link']],
      'Xiaomi AP': [['Mi', '#ff8b3d', 'Xiaomi']],
    }
    const groups = [
      ['Home', [
        ['Li\'s Macbook Pro', 'apple-laptop.webp', '↓122k ↑2.8M'], ['vivo-X200-Pro-mini', 'phone.webp', '↓1.1k ↑4.1k'],
        ['HONOR-70', 'huawei-phone.webp', '↓1k ↑1k'], ['Li\'s iPhone', 'apple-phone.webp', 'now'],
        ['Galaxy-S10', 'samsung-phone.webp', '↓1k ↑1k'], ['Apple TV', 'apple-tv.webp', 'now'],
        ['iPad', 'apple-tablet.webp', '1m ago'], ['Sony TV', 'sony-tv.webp', '2h ago'], ['Settop Box', 'router.webp', '2d ago'],
      ]],
      ['Homelab', [
        ['DS1522plus', 'synology-nas.webp', '↓39k ↑27k'], ['infra', 'server.webp', '↓1.9k ↑4.1k'],
        ['Lis-Mac-mini', 'apple-desktop-mini.webp', '↓30k ↑14k'], ['Li-NUC-Windows', 'desktop-mini.webp', '↓9.8k ↑4.7k'],
        ['debian', 'server.webp', '25m ago'], ['Mercury Switch 2.5G', 'switch.webp', 'now'],
        ['network-routing', 'server.webp', 'now'], ['Proxmox', 'server.webp', 'now'],
        ['TP-Link AP', 'tp-link-router.webp', 'now'], ['Xiaomi AP', 'accesspoint.webp', '↓1k ↑1k'],
      ]],
      ['IoT', [['yunmi-waterpuri-lx12_miap2...', 'waterpurifier.webp', '↓1k ↑1k'], ['hyd-airer-znlyj3_mibt4CC3', 'airer.webp', '↓1k ↑1k']]],
      ['Other devices', [
        ['b6:fc:2d:35:5d:16', null, 'now'], ['32:6d:c2:36:16:12', null, 'idle'],
        ['32:d2:83:90:03:9e', null, '2d ago'], ['36:14:ce:72:6d:89', null, '2d ago'],
        ['36:1f:90:20:b9:16', null, '41h ago'], ['44:e5:17:ed:81:a9', 'desktop-mini.webp', '42h ago'],
        ['5e:ea:7a:29:d3:ec', null, 'idle'], ['66:52:87:74:34:20', null, 'idle'],
        ['a8:51:ab:90:de:ef', 'apple-tv.webp', '43h ago'], ['ba:5c:07:46:92:86', 'server.webp', '3h ago'],
        ['be:32:8e:91:ed:cf', null, '1h ago'], ['de:0d:77:cc:2b:8d', null, 'now'],
      ]],
    ]
    const icon = ([text, tile, title, ink]) => `<span class="svc" title="${title}" style="--tile:${tile};--ink:${ink || '#fff'}">${text}</span>`
    const descriptions = {
      a: '<strong>A · Recommended.</strong> All device rows stay 49px. Service icons follow the name; traffic remains right-aligned. Long names truncate before the icons.',
      b: '<strong>B · More breathing room.</strong> Only rows with services become 65px (instead of the current roughly 80px), with a clearly associated icon line.',
      c: '<strong>C · Strict device rhythm.</strong> Every device row stays 49px; services move to a small index at the top of the group. Association is less immediate.',
    }
    function render(mode) {
      const map = document.querySelector('#map')
      map.className = `map mode-${mode}`
      map.innerHTML = groups.map(([title, devices]) => {
        const index = title === 'Homelab' ? `<div class="service-index"><div class="index-label">Published services</div>${devices.filter(([name]) => services[name]).map(([name]) => `<span class="index-item">${services[name].map(icon).join('')}${name}</span>`).join('')}</div>` : ''
        return `<section class="group ${title === 'Other devices' ? 'other' : ''}"><h2 class="group-title">${title}</h2><div class="list">${index}${devices.map(([name, image, metric]) => {
          const svc = services[name] || []
          const badges = svc.length && mode !== 'c' ? `<span class="services ${mode === 'a' ? 'inline-services' : ''}">${svc.map(icon).join('')}</span>` : ''
          return `<div class="device">${image ? `<img class="device-img" src="${asset + image}" alt="">` : '<span class="unknown"></span>'}<span class="identity"><span class="name" title="${name}">${name}</span>${badges}</span><span class="metric">${metric}</span></div>`
        }).join('')}</div></section>`
      }).join('')
      document.querySelector('#explain').innerHTML = descriptions[mode]
      document.querySelectorAll('.choice').forEach(button => button.setAttribute('aria-selected', button.dataset.mode === mode))
    }
    document.querySelectorAll('.choice').forEach(button => button.addEventListener('click', () => render(button.dataset.mode)))
    render('a')
  </script>
</body>
</html>
