<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Advanced · launcher directory study</title>
<style>
  :root {
    --background: #f6f7f9; --foreground: #171b22; --card: #ffffff;
    --primary: #1d4ed8; --primary-tint: rgb(29 78 216 / 10%);
    --muted-foreground: #5b6472; --accent: #eef2f8; --border: #e2e6ec;
    --tile-backing: #eef2f8; --warning: #935a10;
    font-family: 'Geist Variable', -apple-system, system-ui, 'Segoe UI', sans-serif;
    color: var(--foreground); background: var(--background);
    -webkit-font-smoothing: antialiased; font-synthesis: none;
  }
  html.dark {
    --background: #111318; --foreground: #f1f3f7; --card: #1a1d24;
    --primary: #8ab4ff; --primary-tint: rgb(138 180 255 / 15%);
    --muted-foreground: #abb4c3; --accent: #283142; --border: #343b48;
    --tile-backing: #283142; --warning: #f1c071;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); }
  a { color: inherit; text-decoration: none; }
  .shell { display: flex; min-height: 100vh; flex-direction: column; }
  header { border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--card) 95%, transparent); }
  .bar { margin: 0 auto; display: flex; height: 64px; max-width: 1280px; align-items: center; gap: 10px; padding: 0 32px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.01em; }
  .brand svg { width: 20px; height: 20px; }
  nav ul { display: flex; margin: 0 0 0 24px; padding: 0; gap: 4px; list-style: none; height: 64px; align-items: center; }
  nav a { display: flex; height: 40px; align-items: center; border-radius: 8px; padding: 0 12px; font-size: 14px; color: var(--muted-foreground); }
  nav a[aria-current='page'] { background: var(--primary-tint); color: var(--primary); font-weight: 500; }
  main { margin: 0 auto; width: 100%; max-width: 1280px; flex: 1; padding: 32px; }
  footer { margin: 0 auto; display: flex; max-width: 1280px; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0 16px; padding: 8px 32px 12px; font-size: 12px; color: var(--muted-foreground); }
  footer > * { display: inline-flex; align-items: center; min-height: 44px; }

  .groups { display: flex; flex-direction: column; gap: 32px; }
  section h2 { margin: 0 0 16px; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.015em; }
  .grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); column-gap: 12px; row-gap: 24px; }
  .tile { position: relative; display: flex; min-width: 0; flex-direction: column; align-items: center; gap: 8px; border-radius: 12px; padding: 8px 4px; outline: none; }
  .tile .backing { display: flex; width: 64px; height: 64px; flex: none; align-items: center; justify-content: center; border-radius: 16px; color: #fff; transition: filter .15s; }
  .tile .backing.app { overflow: hidden; padding: 0; background: none; }
  .tile .backing.app img { width: 100%; height: 100%; object-fit: cover; }
  .tile:hover .backing { filter: brightness(1.1); }
  .letter { font-size: 28px; line-height: 1; font-weight: 600; letter-spacing: -0.02em; }
  .label { display: flex; min-width: 0; flex-direction: column; gap: 2px; align-items: center; }
  .name { width: 100%; text-align: center; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tooltip { display: none; position: absolute; z-index: 40; bottom: calc(100% + 6px); left: 50%; translate: -50% 0; width: max-content; max-width: 288px; border-radius: 6px; background: var(--foreground); padding: 6px 12px; font-size: 12px; line-height: 1.6; font-weight: 400; color: var(--background); text-align: left; }
  .tooltip p { margin: 0; }
  .tooltip p + p { margin-top: 6px; }
  .tooltip::after { content: ''; position: absolute; top: calc(100% - 3px); left: 50%; width: 10px; height: 10px; translate: -50% 0; rotate: 45deg; border-radius: 2px; background: var(--foreground); }
  html.tip .tile:focus .tooltip { display: block; }
  .tile:focus-visible .backing { box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--primary); }
  .caption { margin: 28px 0 0; text-align: center; font-size: 11px; color: var(--muted-foreground); }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="bar">
      <a class="brand" href="#">
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="46" fill="#2563eb" /><circle cx="16" cy="20" r="9" fill="#fff" /><circle cx="32" cy="29" r="6" fill="#fff" /></svg>
        Open Linux Router
      </a>
      <nav aria-label="Sections"><ul>
        <li><a href="#">Overview</a></li>
        <li><a href="#">Gateway</a></li>
        <li><a href="#">Wireless</a></li>
        <li><a href="#">Access</a></li>
        <li><a href="#" aria-current="page">Advanced</a></li>
      </ul></nav>
    </div>
  </header>

  <main>
    <div class="groups" id="groups"></div>
    <p class="caption">One hue per group · one line of name · hover/focus tooltip carries the state · <code>#tile</code> gives each tile its own hue · <code>#tip</code> and <code>#dark</code></p>
  </main>

  <footer>
    <span>© 2026 Open Linux Router</span>
    <span>v0.5.0-dev</span>
    <a href="#">GitHub</a>
    <a href="#">Credits</a>
    <span>☾</span>
  </footer>
</div>

<script>
  // Letters, not icons: these tiles are OLR capabilities rather than brands,
  // so each wears its initial on a tinted tile the way Access draws its
  // protocol tiles (docs/access-ui.md). The one exception names an upstream
  // tool and wears that project's own app icon.
  const GROUPS = [
    {
      id: 'system', title: 'System', hue: 250, tiles: [
        { name: 'Firewall', letter: 'F', hue: 220, state: 'On', description: 'Decide what may reach this router and the devices behind it.' },
        { name: 'Admin access', letter: 'A', hue: 290, state: 'Password set', description: 'Password, sessions and sign-out for this web interface.' },
        { name: 'Port forwarding', letter: 'P', hue: 25, state: '2 rules', description: 'Reach a service inside this network through an external port.' },
      ],
    },
    {
      id: 'services', title: 'Services', hue: 190, tiles: [
        { name: 'DDNS', letter: 'D', hue: 190, state: 'unicom.home.iloahz.com', description: 'Keep a public name pointing at this changing address.' },
        { name: 'IPTV multicast', letter: 'I', hue: 330, state: 'On · lan', description: 'Receive the provider’s multicast TV streams on LAN devices.' },
      ],
    },
    {
      id: 'diagnostics', title: 'Diagnostics', hue: 300, tiles: [
        { name: 'Speed test', letter: 'S', hue: 220, state: '', description: 'Measure download, upload and latency from the router to the internet.' },
        { name: 'LAN link test', letter: 'L', hue: 290, state: '', description: 'Measure how fast a device can send and receive data on your local network.' },
        { name: 'NatTypeTester', letter: 'N', hue: 330, state: '', description: 'Run NatTypeTester to see this router’s NAT type and how it maps and filters UDP traffic.' },
        { name: 'Ping', letter: 'P', hue: 25, state: '', description: 'Check whether a destination responds, how quickly, and with how much packet loss.' },
        { name: 'NextTrace', letter: 'T', hue: 190, state: '', artwork: '../../web/public/tool-logos/nexttrace.webp', description: 'Follow the network hops between this router and a hostname or IP address.' },
      ],
    },
  ]

  const hash = location.hash.slice(1)
  const groupHues = !hash.includes('tile')

  const tile = (t, hue, focus) => `
    <a class="tile" href="#"${focus ? ' tabindex="0"' : ''} aria-label="${t.name}${t.state ? ` \u00b7 ${t.state}` : ''}">
      ${t.artwork
        ? `<span class="backing app"><img src="${t.artwork}" alt="" /></span>`
        : `<span class="backing" style="background: oklch(0.52 0.12 ${hue})"><span class="letter" aria-hidden="true">${t.letter}</span></span>`}
      <span class="label"><span class="name">${t.name}</span></span>
      <span class="tooltip" role="tooltip"><p>${t.description}</p>${t.state ? `<p>${t.state}</p>` : ''}</span>
    </a>`

  document.getElementById('groups').innerHTML = GROUPS.map((g) => `
    <section aria-labelledby="g-${g.id}">
      <h2 id="g-${g.id}">${g.title}</h2>
      <div class="grid">${g.tiles.map((t) => tile(t, groupHues ? g.hue : t.hue, g.id === 'diagnostics' && t.name === 'NextTrace')).join('')}</div>
    </section>`).join('')

  if (hash.includes('dark')) document.documentElement.classList.add('dark')
  if (hash.includes('tip')) {
    document.documentElement.classList.add('tip')
    requestAnimationFrame(() => document.querySelector('a.tile[tabindex="0"]')?.focus())
  }
</script>
</body>
</html>
